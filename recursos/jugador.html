<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>Easy HUD</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #08080a;
        color: #e8e8ea;
        font: 14px/1.5 system-ui, 'Segoe UI', sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 6px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        letter-spacing: 0.2em;
      }
      p {
        margin: 0;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <h1>EASY HUD</h1>
    <p>Cliente de jugador en marcha.</p>
    <p>Puedes cerrar esta ventana: sigue funcionando desde la bandeja.</p>
  </body>
</html>
